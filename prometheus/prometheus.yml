global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Prometheus Server Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Docker Containers Metrics (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 3. Web App Metrics
  - job_name: 'student_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']

  # 4. Nginx Web Server Metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # 5. MySQL Database Metrics
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']
