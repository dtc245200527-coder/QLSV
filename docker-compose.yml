services:
  # 1. Reverse Proxy Nginx (SSL/HTTPS + Security Headers)
  nginx:
    image: nginx:alpine
    container_name: sms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - frontend-net
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 128M

  # 2. Ứng dụng Web Quản lý Sinh viên (Node.js/Express)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: sms-app
    restart: unless-stopped
    ports:
      - "${APP_PORT}:3000"
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 3. Cơ sở dữ liệu MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: sms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 512M

  # 4. Công cụ quản trị CSDL phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sms-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 128M

  # ================= MONITORING STACK (COMMIT 2) =================

  # 5. cAdvisor: Thu thập chỉ số Docker containers (CPU, RAM, Network)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sms-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-net
      - frontend-net
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 256M

  # 6. Nginx Prometheus Exporter: Lấy chỉ số Web server
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: sms-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    depends_on:
      - nginx
    networks:
      - monitoring-net
      - frontend-net
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M

  # 7. MySQL Exporter: Thu thập chỉ số CSDL MySQL
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: sms-mysql-exporter
    restart: unless-stopped
    volumes:
      - ./prometheus/my.cnf:/.my.cnf:ro
    command:
      - '--config.my-cnf=/.my.cnf'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - monitoring-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M

  # 8. Prometheus: Thu thập và lưu trữ Metrics
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sms-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - cadvisor
      - nginx-exporter
      - mysql-exporter
    networks:
      - monitoring-net
      - frontend-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 9. Grafana: Hiển thị Dashboard biểu đồ giám sát & Log Explorer
  grafana:
    image: grafana/grafana:10.4.1
    container_name: sms-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring-net
      - frontend-net
      - logging-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ================= LOGGING STACK (COMMIT 3) =================

  # 10. Loki: Hệ thống lưu trữ và đánh chỉ mục Log tập trung
  loki:
    image: grafana/loki:2.9.4
    container_name: sms-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - logging-net
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 11. Promtail: Thu thập log từ Docker daemon và chuyển tiếp về Loki
  promtail:
    image: grafana/promtail:2.9.4
    container_name: sms-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - logging-net
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 128M

volumes:
  mysql_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge
  logging-net:
    driver: bridge
